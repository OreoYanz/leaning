<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#ffd6e8" />
  <title>ㄅㄆㄇ注音樂園</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🐰%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* 注音用系統黑體，筆畫才清楚；標題與按鈕用可愛字體 */
    :root {
      --ink: #5c3a4c;
      --pink: #ef5d93;
      --shadow: #f3b6cc;
      --cream: #fffdfb;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      min-height: 100vh;
      color: var(--ink);
      font-family: "ZCOOL KuaiLe", "Microsoft JhengHei", "PingFang TC", "Segoe UI Emoji", "Apple Color Emoji", sans-serif;
      background: linear-gradient(180deg, #ffe4f1 0%, #fff6d4 48%, #e3f6ff 100%);
      overflow-x: hidden;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    html { scroll-padding-top: 6.2rem; scroll-padding-bottom: 1.2rem; }
    button { font-family: inherit; cursor: pointer; scroll-margin-top: 6.2rem; }
    button:focus-visible { outline: 4px solid #fff; outline-offset: 3px; }

    /* Tailwind 沒載入時，這些常用工具類仍可用 */
    .hidden { display: none !important; }
    .flex { display: flex; }
    .flex-col { flex-direction: column; }
    .items-center { align-items: center; }
    .justify-center { justify-content: center; }
    .justify-between { justify-content: space-between; }
    .gap-3 { gap: 0.75rem; }
    .gap-4 { gap: 1rem; }
    .gap-5 { gap: 1.25rem; }
    .w-full { width: 100%; }
    .mx-auto { margin-left: auto; margin-right: auto; }
    .max-w-5xl { max-width: 64rem; }
    .min-h-screen { min-height: 100vh; }
    .px-4 { padding-left: 1rem; padding-right: 1rem; }
    .py-4 { padding-top: 1rem; padding-bottom: 1rem; }
    .mt-3 { margin-top: 0.75rem; }
    .mt-4 { margin-top: 1rem; }
    .text-center { text-align: center; }
    .relative { position: relative; }
    .sticky { position: sticky; }
    .top-0 { top: 0; }
    .z-20 { z-index: 20; }
    .select-none { user-select: none; }

    .zy { font-family: "Microsoft JhengHei", "PingFang TC", "Heiti TC", sans-serif; font-weight: 700; }
    .emoji { font-family: "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif; }

    .bg-deco { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
    .bg-deco span {
      position: absolute;
      font-size: 2.4rem;
      opacity: 0.45;
      animation: floaty 7s ease-in-out infinite;
    }
    @keyframes floaty {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }

    #app { position: relative; z-index: 1; }

    .fx {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 40;
    }

    .topbar {
      background: rgba(255, 253, 251, 0.94);
      border-radius: 1.6rem;
      padding: 0.4rem;
      margin-bottom: 0.9rem;
      box-shadow: 0 8px 0 rgba(255, 182, 200, 0.45);
    }
    .view-title {
      margin: 0;
      font-size: clamp(1.5rem, 5vw, 2.2rem);
      color: var(--pink);
    }
    .icon-btn {
      width: 4.6rem;
      height: 4.6rem;
      border-radius: 1.4rem;
      background: #fff;
      border: 4px solid #ffd0e2;
      box-shadow: 0 5px 0 #ffd0e2;
      font-size: 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
    }
    .icon-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #ffd0e2; }

    .hero-title {
      margin: 0.2rem 0 0;
      font-size: clamp(2.6rem, 8vw, 4.2rem);
      line-height: 1.12;
      color: var(--pink);
      text-shadow: 0 4px 0 #ffe1ee;
    }
    .rainbow i { font-style: normal; }
    .rainbow i:nth-child(1) { color: #ef5d93; }
    .rainbow i:nth-child(2) { color: #f08a2c; }
    .rainbow i:nth-child(3) { color: #3aa0e8; }
    .mascot-row { font-size: 3rem; letter-spacing: 0.4rem; margin-top: 0.4rem; }
    .mascot-row span { display: inline-block; animation: hop 1.6s ease-in-out infinite; }
    .mascot-row span:nth-child(2) { animation-delay: 0.15s; }
    .mascot-row span:nth-child(3) { animation-delay: 0.3s; }

    .mode-card {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1rem 1.2rem;
      border-radius: 2rem;
      border: 4px solid #fff;
      box-shadow: 0 8px 0 rgba(90, 50, 70, 0.08);
      font-size: clamp(1.8rem, 5vw, 2.5rem);
      color: var(--ink);
      text-align: left;
    }
    .mode-card:active { transform: translateY(4px); box-shadow: 0 4px 0 rgba(90, 50, 70, 0.08); }
    .mode-ico { font-size: 3.2rem; line-height: 1; }
    .c1 { background: #ffe3f0; }
    .c2 { background: #fff1c9; }
    .c3 { background: #ddf6ff; }
    .c4 { background: #e3f8df; }

    .tip {
      margin: 1.2rem auto 0;
      max-width: 36rem;
      background: #fff;
      border-radius: 1rem;
      padding: 0.8rem 1rem;
      font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
      font-size: 1rem;
      line-height: 1.5;
      color: #8a5b70;
    }

    .stage, .panel {
      background: var(--cream);
      border-radius: 2rem;
      box-shadow: 0 10px 0 rgba(255, 170, 190, 0.35);
      padding: 1rem;
    }
    .stage-symbol {
      font-size: clamp(4.5rem, 16vw, 7.5rem);
      line-height: 1;
      color: var(--pink);
    }
    .big-emoji { font-size: clamp(3.5rem, 12vw, 5.5rem); line-height: 1; }
    .stage-word { font-size: clamp(2rem, 6vw, 2.8rem); margin: 0.15rem 0; }
    .stage-zy { font-size: clamp(1.5rem, 4vw, 2rem); letter-spacing: 0.12em; color: #8a5b70; }
    .zy-mark { color: var(--pink); }

    .tabs { display: flex; gap: 0.6rem; margin: 0.9rem 0; }
    .tab {
      flex: 1;
      min-height: 4.8rem;
      border-radius: 1.4rem;
      background: #fff;
      border: 4px solid #ffd0e2;
      box-shadow: 0 5px 0 #ffd0e2;
      font-size: clamp(1.5rem, 4vw, 2rem);
      color: var(--pink);
    }
    .tab.is-on { background: var(--pink); color: #fff; border-color: #e24b82; }
    .tab:active { transform: translateY(3px); box-shadow: 0 2px 0 #ffd0e2; }

    .keys {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(5.4rem, 1fr));
      gap: 0.75rem;
    }
    .zh-key {
      min-height: 5.3rem;
      border-radius: 1.4rem;
      background: #fffdfb;
      color: var(--c, var(--pink));
      border: 4px solid var(--c, var(--pink));
      box-shadow: 0 6px 0 var(--shadow);
      font-size: 2.5rem;
      line-height: 1;
    }
    .zh-key.long { font-size: 1.7rem; letter-spacing: 0.04em; }
    .zh-key.is-on {
      background: #ffe56a;
      color: var(--ink);
      border-color: #f0b429;
      transform: scale(1.06);
    }
    .zh-key:active, .zh-key.is-on:active {
      transform: translateY(4px) scale(1.02);
      box-shadow: 0 2px 0 var(--shadow);
    }

    .row-title {
      margin: 0.2rem 0 0.7rem;
      font-size: 2rem;
      color: var(--pink);
    }
    .row-title.blue { color: #2f95d6; margin-top: 1.1rem; }

    .slot {
      width: 5.4rem;
      height: 5.4rem;
      border-radius: 1.4rem;
      background: #fff;
      border: 4px dashed #f3b6cc;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.6rem;
      color: #e3b7c6;
      transition: transform 0.15s ease, background 0.15s ease;
    }
    .slot.wide { width: 7.4rem; font-size: 2rem; letter-spacing: 0.02em; }
    .slot.filled { border-style: solid; color: var(--ink); border-color: #ff8fbe; background: #fff; }
    .slot.is-hot { background: #fff3b0; transform: scale(1.08); border-style: solid; }
    .slot.magnet {
      background: #fff3b0;
      border-style: solid;
      border-color: #f0b429;
      box-shadow: 0 0 0 7px rgba(255, 214, 80, 0.55);
    }
    .track {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: min(100%, 24rem);
      min-height: 7.4rem;
      margin: 0.2rem auto 0;
    }
    .rail {
      position: absolute;
      left: 16%;
      right: 16%;
      top: 50%;
      height: 0.75rem;
      margin-top: -0.38rem;
      border-radius: 999px;
      background: #ffe4ef;
      box-shadow: inset 0 3px 0 #ffd0e2;
      z-index: 0;
    }
    .nudge {
      position: absolute;
      left: 0;
      top: 50%;
      font-size: 1.7rem;
      opacity: 0;
      transform: translateY(-50%);
    }
    .drag {
      position: relative;
      z-index: 2;
      touch-action: none;
      cursor: grab;
    }
    .drag.is-dragging { cursor: grabbing; z-index: 6; animation: none; }
    .drag.snap-back { transition: transform 0.38s cubic-bezier(.2, 1.25, .36, 1); }
    .track.ready .drag { animation: invite 1.15s ease-in-out infinite; }
    .track.ready .nudge { animation: slide-hint 1.15s ease-in-out infinite; }
    @keyframes invite {
      0%, 100% { transform: translateX(0); }
      50% { transform: translateX(16px); }
    }
    @keyframes slide-hint {
      0% { opacity: 0; transform: translate(0, -50%); }
      20% { opacity: 1; }
      100% { opacity: 0; transform: translate(34px, -50%); }
    }
    .panel.impact { animation: impact 0.42s linear; }
    @keyframes impact {
      0%, 100% { transform: translate3d(0, 0, 0); }
      15% { transform: translate3d(-8px, 3px, 0); }
      30% { transform: translate3d(8px, -2px, 0); }
      45% { transform: translate3d(-6px, 1px, 0); }
      60% { transform: translate3d(5px, -1px, 0); }
      75% { transform: translate3d(-2px, 0, 0); }
    }
    .op { font-size: 2.2rem; }
    .tone-row {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 0.4rem;
      margin-top: 0.75rem;
    }
    .tone-btn {
      min-height: 4.8rem;
      border-radius: 1.15rem;
      border: 4px solid #ffd0e2;
      background: #fff;
      box-shadow: 0 5px 0 #ffd0e2;
      color: var(--ink);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      line-height: 1;
      padding: 0.25rem 0.1rem 0.35rem;
    }
    .tone-btn .mark { font-size: 1.7rem; color: var(--pink); min-height: 1.2em; }
    .tone-btn .name { font-size: 1.05rem; }
    .tone-btn.is-on {
      background: #ffe56a;
      border-color: #f0b429;
      box-shadow: 0 5px 0 #e6b423;
    }
    .tone-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #ffd0e2; }

    .mirror {
      min-width: 9rem;
      min-height: 6.6rem;
      margin-top: 0.2rem;
      padding: 0.35rem 0.8rem 0.5rem;
      border-radius: 2rem;
      background: #fff;
      border: 5px dashed #ffc2d8;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .mirror.is-hot {
      border-style: solid;
      border-color: #ff8fbe;
      background: #fff7c9;
      animation: popin 0.35s ease;
    }
    .mirror-zy { font-size: clamp(2.6rem, 9vw, 4rem); line-height: 1; color: var(--pink); }
    .mirror-zy.long { font-size: clamp(1.8rem, 6.5vw, 3rem); letter-spacing: 0.04em; }
    .mirror-word {
      font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
      font-size: 2.4rem;
      font-weight: 700;
      min-height: 1.2em;
      color: var(--ink);
    }
    .mirror-word.pop { animation: wordpop 0.45s cubic-bezier(.2, 1.4, .4, 1); }
    @keyframes wordpop {
      0% { transform: scale(0.15); opacity: 0; }
      60% { transform: scale(1.28); opacity: 1; }
      100% { transform: scale(1); }
    }
    .mirror-emoji { font-size: 3.2rem; min-height: 1.1em; margin-top: 0.25rem; }
    @keyframes popin {
      0% { transform: scale(0.7); }
      60% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }
    @keyframes hop {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }
    .hop { animation: hop 0.7s ease-in-out 2; }
    @keyframes wobble {
      0%, 100% { transform: translateX(0) rotate(0); }
      25% { transform: translateX(-8px) rotate(-4deg); }
      75% { transform: translateX(8px) rotate(4deg); }
    }
    .wobble { animation: wobble 0.38s ease; }

    .blend-btn, .win-btn {
      width: 100%;
      max-width: 22rem;
      min-height: 5.2rem;
      border-radius: 999px;
      border: 0;
      background: linear-gradient(180deg, #ffb0d0, #ff7eae);
      color: #fff;
      font-size: 2.2rem;
      box-shadow: 0 8px 0 #e56b9b;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }
    .blend-btn:active, .win-btn:active { transform: translateY(4px); box-shadow: 0 4px 0 #e56b9b; }
    .win-btn.ghost {
      background: #fff;
      color: var(--pink);
      box-shadow: 0 8px 0 #ffd0e2;
    }

    .stars { display: flex; justify-content: center; gap: 0.35rem; font-size: 1.8rem; min-height: 2.2rem; }
    .star { filter: grayscale(1); opacity: 0.35; transform: scale(0.9); transition: 0.2s transform; }
    .star.got { filter: none; opacity: 1; transform: scale(1.15); }

    .ear-btn {
      width: 7.2rem;
      height: 7.2rem;
      border-radius: 50%;
      background: #fff;
      border: 5px solid #ffb3d0;
      box-shadow: 0 8px 0 #ffd0e2;
      font-size: 3.3rem;
    }
    .ear-btn:active { transform: translateY(3px); box-shadow: 0 4px 0 #ffd0e2; }
    .ear-btn.is-speaking { animation: pulse 0.8s ease-in-out infinite; }
    @keyframes pulse {
      50% { transform: scale(1.08); box-shadow: 0 0 0 12px rgba(255, 180, 200, 0.45); }
    }
    .quiz-fallback {
      display: none;
      margin-top: 0.4rem;
      font-size: 3rem;
      color: var(--pink);
    }
    .quiz-fallback.show { display: block; }

    .balloons {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.8rem 0.4rem;
      justify-items: center;
      margin-top: 0.6rem;
    }
    @media (min-width: 760px) {
      .balloons { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    }
    .balloon {
      position: relative;
      width: 8.2rem;
      background: transparent;
      border: 0;
      padding: 0 0 0.4rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .balloon-body {
      width: 7.3rem;
      height: 8.1rem;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      box-shadow: inset -12px -14px 0 rgba(255, 255, 255, 0.28), 0 8px 0 rgba(90, 50, 70, 0.06);
    }
    .balloon-body::after {
      content: "";
      position: absolute;
      bottom: -7px;
      width: 14px;
      height: 10px;
      background: inherit;
      clip-path: polygon(50% 100%, 0 0, 100% 0);
    }
    .balloon-text { color: var(--ink); line-height: 1; }
    .string {
      width: 2px;
      height: 34px;
      background: #e3bfd0;
      margin-top: 8px;
    }
    .boom-star {
      position: absolute;
      top: 1.6rem;
      font-size: 3rem;
      opacity: 0;
      pointer-events: none;
    }
    .balloon.popped .balloon-body,
    .balloon.popped .string { animation: balloon-pop 0.42s ease forwards; }
    .balloon.popped .boom-star { animation: starin 0.35s 0.18s ease forwards; }
    @keyframes balloon-pop {
      0% { transform: scale(1); opacity: 1; }
      40% { transform: scale(1.28); opacity: 1; }
      100% { transform: scale(0.2); opacity: 0; }
    }
    @keyframes starin {
      0% { opacity: 0; transform: scale(0.2); }
      100% { opacity: 1; transform: scale(1); }
    }

    .win {
      position: fixed;
      inset: 0;
      z-index: 60;
      background: rgba(255, 236, 246, 0.78);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .win-card {
      width: min(92vw, 28rem);
      background: #fffdfb;
      border-radius: 2rem;
      padding: 1.4rem 1.2rem 1.5rem;
      text-align: center;
      box-shadow: 0 12px 0 rgba(255, 170, 190, 0.45);
    }
    .win-emoji { font-size: 5rem; }
    .win-text { margin: 0.2rem 0 1rem; font-size: 2.6rem; color: var(--pink); }

    @media (prefers-reduced-motion: reduce) {
      .bg-deco span, .mascot-row span, .track.ready .drag, .track.ready .nudge, .panel.impact, .mirror-word.pop { animation: none; }
    }
  </style>
</head>
<body>
  <div class="bg-deco" aria-hidden="true">
    <span style="left:5%;top:7%">☁️</span>
    <span style="right:7%;top:12%;animation-delay:.4s">⭐</span>
    <span style="left:8%;bottom:10%;animation-delay:.8s">🌸</span>
    <span style="right:10%;bottom:14%;animation-delay:.2s">🌈</span>
    <span style="left:42%;top:3%;animation-delay:.6s">🎈</span>
  </div>
  <canvas id="confetti" class="fx" aria-hidden="true"></canvas>

  <div id="app" class="mx-auto max-w-5xl px-4 py-4 min-h-screen select-none">
    <header id="topbar" class="topbar sticky top-0 z-20 flex items-center justify-between gap-3 hidden">
      <button type="button" id="btn-home" class="icon-btn" aria-label="回首頁">🏠</button>
      <h1 id="view-title" class="view-title">認識注音</h1>
      <button type="button" class="icon-btn js-mute" aria-label="開關聲音">🔊</button>
    </header>

    <!-- 首頁 -->
    <section id="view-home" class="screen">
      <div class="text-center">
        <div class="mascot-row emoji" aria-hidden="true"><span>🐰</span><span>🌈</span><span>🐻</span></div>
        <h1 class="hero-title"><span class="zy rainbow"><i>ㄅ</i><i>ㄆ</i><i>ㄇ</i></span><br />注音樂園</h1>
      </div>
      <div class="flex flex-col gap-4 mt-4" style="max-width:34rem;margin-left:auto;margin-right:auto">
        <button type="button" class="mode-card c1" data-go="roster">
          <span class="mode-ico emoji">📒</span>
          <span>認識注音</span>
        </button>
        <button type="button" class="mode-card c2" data-go="magic">
          <span class="mode-ico emoji">🪄</span>
          <span>拼一拼</span>
        </button>
        <button type="button" class="mode-card c4" data-go="he">
          <span class="mode-ico emoji">🧩</span>
          <span>拼<span class="zy">ㄧㄚ</span></span>
        </button>
        <button type="button" class="mode-card c3" data-go="quiz">
          <span class="mode-ico emoji">🎈</span>
          <span>聽一聽</span>
        </button>
        <button type="button" class="icon-btn js-mute" style="margin:0.2rem auto 0" aria-label="開關聲音">🔊</button>
      </div>
      <p id="voice-tip" class="tip hidden">這個瀏覽器目前沒有中文語音。請用 Chrome 或 Edge 開啟，才能聽到注音。沒有聲音時，聽一聽會改成看字找注音。</p>
    </section>

    <!-- 模式一：注音點名簿 -->
    <section id="view-roster" class="screen hidden">
      <div class="stage text-center">
        <div id="stage-empty">
          <div class="big-emoji emoji hop">🐰</div>
          <div class="big-emoji emoji">👆</div>
        </div>
        <div id="stage-full" class="hidden">
          <div class="flex items-center justify-center gap-4">
            <div id="stage-emoji" class="big-emoji emoji">🥤</div>
            <div id="stage-symbol" class="stage-symbol zy">ㄅ</div>
          </div>
          <p id="stage-word" class="stage-word">杯子</p>
          <p id="stage-zy" class="stage-zy zy">ㄅㄟ ㄗˇ</p>
          <button type="button" id="btn-replay-symbol" class="icon-btn" style="margin:0.4rem auto 0" aria-label="再聽一次">🔊</button>
        </div>
      </div>

    const AudioFX = (() => {
      let ctx;
      function ac() {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        if (!ctx) ctx = new AC();
        if (ctx.state === "suspended") ctx.resume();
        return ctx;
      }
      function tone(freq, delay, dur, type, vol) {
        const audio = ac();
        if (!audio) return;
        const t = audio.currentTime + delay;
        const osc = audio.createOscillator();
        const gain = audio.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, t);
        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.exponentialRampToValueAtTime(vol, t + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        osc.connect(gain);
        gain.connect(audio.destination);
        osc.start(t);
        osc.stop(t + dur + 0.02);
      }
      return {
        unlock() { ac(); },
        pop() {
          const base = 640 + Math.random() * 160;
          tone(base, 0, 0.12, "sine", 0.12);
          tone(base * 1.35, 0.07, 0.14, "sine", 0.08);
        },
        ding() {
          tone(880, 0, 0.14, "sine", 0.1);
          tone(1320, 0.09, 0.22, "sine", 0.09);
        },
        soft() {
          tone(392, 0, 0.16, "sine", 0.05);
          tone(311, 0.1, 0.2, "triangle", 0.04);
        },
        magic() {
          [523, 659, 784, 1046].forEach((freq, i) => tone(freq, i * 0.07, 0.16, "sine", 0.07));
        },
        fanfare() {
          [523, 659, 784, 1046, 784, 1318].forEach((freq, i) => tone(freq, i * 0.08, 0.2, "triangle", 0.07));
        },
        clack() {
          const audio = ac();
          tone(210, 0, 0.09, "triangle", 0.16);
          tone(480, 0.03, 0.08, "square", 0.05);
          if (!audio) return;
          const dur = 0.06;
          const buffer = audio.createBuffer(1, Math.floor(audio.sampleRate * dur), audio.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < data.length; i += 1) data[i] = (Math.random() * 2 - 1) * (1 - i / data.length);
          const src = audio.createBufferSource();
          const filter = audio.createBiquadFilter();
          const gain = audio.createGain();
          src.buffer = buffer;
          filter.type = "bandpass";
          filter.frequency.value = 1400;
          gain.gain.setValueAtTime(0.28, audio.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + dur);
          src.connect(filter);
          filter.connect(gain);
          gain.connect(audio.destination);
          src.start();
        }
      };
    })();

    let speechGen = 0;

    function getVoice() {
      if (typeof speechSynthesis === "undefined") return null;
      if (voiceCache) return voiceCache;
      const voices = speechSynthesis.getVoices();
      const score = (voice) => {
        const lang = (voice.lang || "").toLowerCase();
        if (lang === "zh-tw" || lang.startsWith("zh-tw")) return 0;
        if (lang.startsWith("zh")) return 1;
        return 9;
      };
      const found = voices.filter((voice) => score(voice) < 9).sort((a, b) => score(a) - score(b))[0];
      voiceCache = found || null;
      return voiceCache;
    }

    function beginSpeech() {
      speechGen += 1;
      const gen = speechGen;
      try { if (window.speechSynthesis) speechSynthesis.cancel(); } catch (err) { /* 忽略 */ }
      return { alive: () => gen === speechGen };
    }

    function say(session, text, opts) {
      const options = opts || {};
      return new Promise((resolve) => {
        const finish = () => resolve(session.alive());
        if (!session.alive()) return finish();
        if (state.muted || !speechOk || !window.speechSynthesis || !text) {
          wait(options.muteWait == null ? 380 : options.muteWait).then(finish);
          return;
        }
        const start = () => {
          if (!session.alive()) return finish();
          const utter = new SpeechSynthesisUtterance(text);
          keptUtter.push(utter);
          if (keptUtter.length > 16) keptUtter.shift();
          utter.lang = "zh-TW";
          utter.rate = options.rate == null ? 0.86 : options.rate;
          utter.pitch = options.pitch == null ? 1.22 : options.pitch;
          utter.volume = 1;
          const voice = getVoice();
          if (voice) utter.voice = voice;
          let done = false;
          const end = () => {
            if (done) return;
            done = true;
            finish();
          };
          utter.onend = end;
          utter.onerror = end;
          const timer = setTimeout(() => {
            if (!done && session.alive()) {
              try { speechSynthesis.cancel(); } catch (err) { /* 忽略 */ }
            }
            end();
          }, 7000);
          utter.onend = () => { clearTimeout(timer); end(); };
          speechSynthesis.speak(utter);
        };
        setTimeout(start, options.lead || 0);
      });
    }

        const x = Math.cos(angle) * r;
        const y = Math.sin(angle) * r;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.fill();
    }

    function burst(x, y, count) {
      for (let i = 0; i < count; i += 1) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 3 + Math.random() * 7;
        pieces.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 3,
          g: 0.16 + Math.random() * 0.08,
          size: 7 + Math.random() * 8,
          color: FX_COLORS[i % FX_COLORS.length],
          rot: Math.random() * 6,
          vr: (Math.random() - 0.5) * 0.25,
          life: 70 + Math.random() * 30,
          shape: Math.random() < 0.55 ? "star" : (Math.random() < 0.5 ? "rect" : "circle")
        });
      }
      if (pieces.length > 260) pieces.splice(0, pieces.length - 260);
      if (!fxRunning) {
        fxRunning = true;
        requestAnimationFrame(tickFx);
      }
    }

    function rain(count) {
      for (let i = 0; i < count; i += 1) {
        pieces.push({
          x: Math.random() * window.innerWidth,
          y: -20 - Math.random() * 80,
          vx: -0.4 + Math.random() * 0.8,
          vy: 2 + Math.random() * 3,
          g: 0.02,
          size: 8 + Math.random() * 8,
          color: FX_COLORS[i % FX_COLORS.length],
          rot: Math.random() * 6,
          vr: (Math.random() - 0.5) * 0.2,
          life: 110,
          shape: "star"
        });
      }
      if (!fxRunning) {
        fxRunning = true;
        requestAnimationFrame(tickFx);
      }
    }

    function tickFx() {
      fxCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);
      for (let i = pieces.length - 1; i >= 0; i -= 1) {
        const p = pieces[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += p.g;
        p.rot += p.vr;
        p.life -= 1;
        if (p.life <= 0 || p.y > window.innerHeight + 40) {
          pieces.splice(i, 1);
          continue;
        }
        fxCtx.save();
        fxCtx.translate(p.x, p.y);
        fxCtx.rotate(p.rot);
        fxCtx.globalAlpha = Math.max(0, Math.min(1, p.life / 30));
        fxCtx.fillStyle = p.color;
        if (p.shape === "star") drawStar(fxCtx, p.size * 0.55);
        else if (p.shape === "circle") {
          fxCtx.beginPath();
          fxCtx.arc(0, 0, p.size * 0.35, 0, Math.PI * 2);
          fxCtx.fill();
        } else {
          fxCtx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
        }
        fxCtx.restore();
      }
      if (pieces.length) requestAnimationFrame(tickFx);
      else {
        fxRunning = false;
        fxCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);
      }
    }

    function sparkleFrom(el) {
      const rect = el.getBoundingClientRect();
      burst(rect.left + rect.width / 2, rect.top + rect.height / 2, 16);
    }

    let rosterPlay = 0;

    function renderZy(el, zy, id) {
      el.textContent = "";
      const at = zy.indexOf(id);
      if (at < 0) {
        el.textContent = zy;
        return;
      }
      el.append(document.createTextNode(zy.slice(0, at)));
      const mark = document.createElement("span");
      mark.className = "zy-mark";
      mark.textContent = id;
      el.append(mark);
      el.append(document.createTextNode(zy.slice(at + id.length)));

    function chooseExample(item) {
      const list = item.examples;
      if (!list || !list.length) return { emoji: item.emoji, word: item.word, zy: item.zy };
      if (list.length === 1) return list[0];
      let next = pick(list);
      const previous = state.rosterItem === item ? state.rosterExample : null;
      let guard = 0;
      while (previous && next.word === previous.word && guard < 6) {
        next = pick(list);
        guard += 1;
      }
      return next;
    }

    function showRoster(item) {
      const example = chooseExample(item);
      state.rosterItem = item;
      state.rosterExample = example;
      $("stage-empty").classList.add("hidden");
      $("stage-full").classList.remove("hidden");
      $("stage-symbol").textContent = item.id;
      $("stage-emoji").textContent = example.emoji;
      $("stage-word").textContent = example.word;
      renderZy($("stage-zy"), example.zy, item.id);
      const emoji = $("stage-emoji");
      emoji.classList.remove("hop");
      void emoji.offsetWidth;
      emoji.classList.add("hop");
    }

    async function speakRoster(item) {
      const token = ++rosterPlay;
      const session = beginSpeech();
      const still = () => token === rosterPlay && session.alive();
      const example = state.rosterExample && state.rosterItem === item
        ? state.rosterExample
        : { emoji: item.emoji, word: item.word, zy: item.zy };
      await say(session, item.call, { rate: 0.68, pitch: 1.2, lead: 80 });
      if (!still()) return;
      if (example.word && example.word !== item.call && zyHas(example.zy, item.id)) {
        await wait(160);
        if (!still()) return;
        await say(session, example.word, { rate: 0.9, pitch: 1.24, lead: 0 });
      }
    }

    function makeKey(item, onClick) {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "zh-key zy" + (item.id.length > 1 ? " long" : "");

      btn.textContent = item.id;
      btn.setAttribute("aria-label", item.id);
      btn.addEventListener("click", () => onClick(item, btn));
      return btn;
    }

    function hashCode(text) {
      let n = 0;
      for (let i = 0; i < text.length; i += 1) n = (n + text.charCodeAt(i) * (i + 1)) % 997;
      return n;
    }

    function initRoster() {
      const grids = { sheng: $("grid-sheng"), yun: $("grid-yun"), he: $("grid-he") };
      SYMBOLS.forEach((item) => {

    // ============================================================
    // 模式二：魔法屋
    // 拼一拼是聲母＋韻母，拼ㄧㄚ是聲母＋結合韻。
    // 把聲母拖到韻母上，靠近就吸住，再流暢唸出拼好的音和例字。
    // ============================================================

    function makeBoard(viewId, blends, tones, finalGroup) {
      const el = $(viewId);
      const q = (sel) => el.querySelector(sel);
      return {
        el, blends, tones, finalGroup,
        sheng: null, yun: null, tone: 1, blended: false, token: 0, dragging: false,
        track: q("[data-track]"),
        drag: q("[data-drag]"),
        slotS: q('[data-slot="s"]'),
        slotY: q('[data-slot="y"]'),
        mirror: q("[data-mirror]"),
        mirrorZy: q("[data-zy]"),
        mirrorWord: q("[data-word]"),
        mirrorEmoji: q("[data-emoji]"),
        shengBox: q('[data-keys="sheng"]'),
        finalBox: q('[data-keys="final"]'),
        panel: q(".panel")
      };
    }

    const boards = {
      magic: null,
      he: null
    };

    function slotText(el, item) {
      el.textContent = item ? item.id : "?";
      el.classList.toggle("filled", Boolean(item));
    }

    function setMirror(board, zy, word, emoji, hot) {
      board.mirrorZy.textContent = zy;
      board.mirrorWord.textContent = word || "";
      board.mirrorEmoji.textContent = emoji || "";
      board.mirror.classList.toggle("is-hot", Boolean(hot));
      if (hot) {
        board.mirror.classList.remove("popin");
        void board.mirror.offsetWidth;
      }
      if (emoji) {
        board.mirrorEmoji.classList.remove("hop");
        void board.mirrorEmoji.offsetWidth;
        board.mirrorEmoji.classList.add("hop");
      }
      if (word) {
        board.mirrorWord.classList.remove("pop");
        void board.mirrorWord.offsetWidth;
        board.mirrorWord.classList.add("pop");
      }
    }

    function formatTone(syllable, tone) {
      if (tone === 2) return syllable + "ˊ";
      if (tone === 3) return syllable + "ˇ";
      if (tone === 4) return syllable + "ˋ";
      if (tone === 0) return "˙" + syllable;
      return syllable;
    }

    function toneChar(table, key, tone) {
      const row = table[key];
      if (!row) return "";
      return row[tone === 0 ? 4 : tone - 1] || "";
    }

    function toneResult(board, key, tone) {
      const base = board.blends[key];
      const word = toneChar(board.tones, key, tone);
      const zy = formatTone(key, tone);
      if (word) {
        return { zy, word, emoji: base && base[0] === word ? base[1] : "", speak: word };
      }
      return { zy, word: TONE_NAME[tone], emoji: "", speak: TONE_NAME[tone] };
    }

    function selectPiece(board, which, item, btn) {
      AudioFX.pop();
      const box = which === "sheng" ? board.shengBox : board.finalBox;
      box.querySelectorAll(".zh-key").forEach((key) => key.classList.remove("is-on"));
      btn.classList.add("is-on");
      board.blended = false;
      if (which === "sheng") {
        board.sheng = item;
        slotText(board.slotS, item);
      } else {
        board.yun = item;
        slotText(board.slotY, item);
      }
      setMirror(board, "✨", "", "", false);
      releaseDrag(board);
      refreshReady(board);
    }

    function selectTone(board, tone, btn) {
      AudioFX.pop();
      board.tone = tone;
      board.el.querySelectorAll(".tone-btn").forEach((el) => {
        const on = el === btn;
        el.classList.toggle("is-on", on);
        el.setAttribute("aria-pressed", on ? "true" : "false");
      });
      const key = board.sheng && board.yun ? board.sheng.id + board.yun.id : "";
      if (!board.blended || !key || !board.blends[key]) return;
      const voiced = toneResult(board, key, tone);
      setMirror(board, voiced.zy, voiced.word, voiced.emoji, true);
      const session = beginSpeech();
      say(session, voiced.speak, { rate: 0.95, pitch: 1.3, lead: 70 });
    }

    function refreshReady(board) {
      board.track.classList.toggle("ready", Boolean(board.sheng && board.yun) && !board.dragging);
    }

    function releaseDrag(board) {
      const drag = board.drag;
      const moved = Boolean(drag.style.transform);
      board.dragging = false;
      drag.classList.remove("is-dragging");
      drag.classList.add("snap-back");
      drag.style.transition = "";
      drag.style.transform = "";
      board.slotS.classList.remove("magnet");
      board.slotY.classList.remove("magnet");
      if (moved) {
        let done = false;
        const finish = () => {
          if (done) return;
          done = true;
          refreshReady(board);
        };
        drag.addEventListener("transitionend", finish, { once: true });
        setTimeout(finish, 450);
      } else refreshReady(board);
    }

    function pairDistance(board) {
      const a = board.drag.getBoundingClientRect();
      const b = board.slotY.getBoundingClientRect();
      const ax = a.left + a.width / 2;
      const ay = a.top + a.height / 2;
      const bx = b.left + b.width / 2;
      const by = b.top + b.height / 2;
      return { a, b, ax, ay, bx, by, dist: Math.hypot(bx - ax, by - ay) };
    }

    async function playBlend(board) {
      const token = ++board.token;
      const sheng = board.sheng;
      const yun = board.yun;
      const tone = board.tone;
      const session = beginSpeech();
      if (!sheng || !yun) {
        AudioFX.soft();
        board.slotS.classList.remove("wobble");
        board.slotY.classList.remove("wobble");
        void board.slotS.offsetWidth;
        if (!sheng) board.slotS.classList.add("wobble");
        if (!yun) board.slotY.classList.add("wobble");
        await say(session, "再選一個", { rate: 0.9, pitch: 1.25, lead: 80 });
        return;
      }

      const key = sheng.id + yun.id;
      if (!board.blends[key]) {
        board.blended = false;
        setMirror(board, "🤗", "", "🤗", true);
        board.mirror.classList.add("wobble");
        AudioFX.soft();
        await say(session, "再換一組看看喔", { rate: 0.92, pitch: 1.28, lead: 0 });
        board.mirror.classList.remove("wobble");
        return;
      }

      if (token !== board.token || !session.alive()) return;
      const voiced = toneResult(board, key, tone);
      board.blended = true;
      setMirror(board, voiced.zy, voiced.word, voiced.emoji, true);
      sparkleFrom(board.mirror);
      await say(session, voiced.speak, { rate: 0.98, pitch: 1.3, lead: 30 });
    }

    function currentShift(el) {
      const raw = getComputedStyle(el).transform;
      if (!raw || raw === "none") return { x: 0, y: 0 };
      const m = new DOMMatrix(raw);
      return { x: m.m41, y: m.m42 };
    }

    async function stickAndSpeak(board) {
      const drag = board.drag;
      const here = pairDistance(board);
      const current = currentShift(drag);
      const x = current.x + (here.bx - here.a.width * 0.46 - here.ax);
      const y = current.y + (here.by - here.ay);
      board.track.classList.remove("ready");
      drag.classList.add("is-dragging");
      drag.classList.remove("snap-back");
      drag.style.transition = "transform 0.12s ease-out";
      drag.style.transform = "translate(" + x + "px, " + y + "px)";
      board.slotS.classList.add("magnet");
      board.slotY.classList.add("magnet");
      AudioFX.clack();
      if (navigator.vibrate) navigator.vibrate([20, 30, 50]);
      board.panel.classList.remove("impact");
      void board.panel.offsetWidth;
      board.panel.classList.add("impact");
      sparkleFrom(board.slotY);
      await wait(140);
      await playBlend(board);
      await wait(260);
      if (!board.dragging) releaseDrag(board);
    }

    function bindDrag(board) {
      const drag = board.drag;
      let pointer = null;
      let originX = 0;
      let originY = 0;

      function moveTo(clientX, clientY) {
        const dx = clientX - originX;
        const dy = clientY - originY;
        drag.style.transform = "translate(" + dx + "px, " + dy + "px)";
        const here = pairDistance(board);
        if (here.dist < 150 && here.dist > 8) {
          const pull = ((150 - here.dist) / 150) * 0.55;
          drag.style.transform = "translate(" + (dx + (here.bx - here.ax) * pull) + "px, " + (dy + (here.by - here.ay) * pull) + "px)";
        }
        const near = pairDistance(board).dist < 96;
        board.slotS.classList.toggle("magnet", near);
        board.slotY.classList.toggle("magnet", near);
        return near;
      }

      drag.addEventListener("pointerdown", (ev) => {
        if (ev.button !== undefined && ev.button !== 0) return;
        if (!board.sheng) {
          board.slotS.classList.remove("wobble");
          void board.slotS.offsetWidth;
          board.slotS.classList.add("wobble");
          AudioFX.soft();
          const session = beginSpeech();
          say(session, "再選一個", { rate: 0.9, pitch: 1.25, lead: 60 });
          return;
        }
        pointer = ev.pointerId;
        originX = ev.clientX;
        originY = ev.clientY;
        board.dragging = true;
        board.track.classList.remove("ready");
        drag.classList.add("is-dragging");
        drag.classList.remove("snap-back");
        drag.style.transition = "none";
        try { drag.setPointerCapture(ev.pointerId); } catch (err) { /* 某些觸控環境不允許 */ }
        moveTo(ev.clientX, ev.clientY);
      });

      drag.addEventListener("pointermove", (ev) => {
        if (pointer !== ev.pointerId) return;
        moveTo(ev.clientX, ev.clientY);
      });

      async function finish(ev) {
        if (pointer !== ev.pointerId) return;
        const near = moveTo(ev.clientX, ev.clientY);
        pointer = null;
        board.dragging = false;
        try { drag.releasePointerCapture(ev.pointerId); } catch (err) { /* already released */ }
        const key = board.sheng && board.yun ? board.sheng.id + board.yun.id : "";
        if (near && key && board.blends[key]) {
          await stickAndSpeak(board);
          return;
        }
        releaseDrag(board);
        if (near) await playBlend(board);
      }

      drag.addEventListener("pointerup", finish);
      drag.addEventListener("pointercancel", (ev) => {
        if (pointer !== ev.pointerId) return;
        pointer = null;
        releaseDrag(board);
      });

      drag.addEventListener("keydown", (ev) => {
        if (ev.key !== "Enter" && ev.key !== " ") return;
        ev.preventDefault();
        if (!board.sheng || !board.yun) {
          playBlend(board);
          return;
        }
        const key = board.sheng.id + board.yun.id;
        if (!board.blends[key]) {
          releaseDrag(board);
          playBlend(board);
          return;
        }
        stickAndSpeak(board);
      });
    }

    function initBoard(board) {
      SYMBOLS.filter((item) => item.group === "sheng").forEach((item) => {
        board.shengBox.append(makeKey(item, (picked, btn) => selectPiece(board, "sheng", picked, btn)));
      });
      SYMBOLS.filter((item) => item.group === board.finalGroup).forEach((item) => {
        board.finalBox.append(makeKey(item, (picked, btn) => selectPiece(board, "yun", picked, btn)));
      });
      bindDrag(board);
      board.el.querySelectorAll(".tone-btn").forEach((btn) => {
        btn.addEventListener("click", () => selectTone(board, Number(btn.dataset.tone), btn));
      });
    }

    function initMagic() {
      boards.magic = makeBoard("view-magic", BLENDS, TONE_CHARS, "yun");
      boards.he = makeBoard("view-he", HE_BLENDS, HE_TONES, "he");
      initBoard(boards.magic);
      initBoard(boards.he);
    }

    // ============================================================
    // 模式三：聽音尋寶
    // 答錯不扣星，可以再試，直到點到正確的氣球。
    // ============================================================

    const quiz = { questions: [], index: 0, locked: false, hinted: false, prompt: "" };
    let hearUi = 0;

    function symbolQuestion(id) {
      const item = byId.get(id);
      const pool = shuffle(SYMBOLS.filter((s) => s.group === item.group && s.id !== id)).slice(0, 3);
      return {
        prompt: item.call,
        options: shuffle([item.id, ...pool.map((s) => s.id)]).map((label) => ({ label, ok: label === id }))
      };
    }

    function blendQuestion(key) {
      const pool = shuffle(EASY_KEYS.filter((k) => k !== key)).slice(0, 3);
      return {
        prompt: BLENDS[key][0],
        options: shuffle([key, ...pool]).map((label) => ({ label, ok: label === key }))
      };
    }

    function buildRound() {
      const warmPool = ["ㄅ", "ㄆ", "ㄇ", "ㄈ", "ㄉ", "ㄊ", "ㄚ", "ㄛ", "ㄨ", "ㄧ", "ㄩ", "ㄍ", "ㄏ"];
      const warm = shuffle(warmPool).slice(0, 3);
      const used = new Set(warm);
      const more = shuffle(SYMBOLS.filter((s) => (s.group === "sheng" || s.group === "yun") && !used.has(s.id)))
        .slice(0, 3)
        .map((s) => s.id);
      const blends = shuffle(EASY_KEYS).slice(0, 2);
      return [...warm.map(symbolQuestion), ...more.map(symbolQuestion), ...blends.map(blendQuestion)];
    }

    function renderStars() {
      const box = $("stars");
      box.textContent = "";
      quiz.questions.forEach((_, i) => {
        const star = document.createElement("span");
        star.className = "star" + (i < quiz.index ? " got" : "");
        star.textContent = "⭐";
        box.append(star);
      });
    }

    function syncQuizFallback() {
      const el = $("quiz-fallback");
      const show = state.muted || !speechOk;
      el.classList.toggle("show", show);
      el.textContent = show ? quiz.prompt : "";
    }

    function renderBalloons(question) {
      const box = $("balloons");
      box.textContent = "";
      question.options.forEach((opt, i) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "balloon";
        btn.setAttribute("aria-label", opt.label);
        const body = document.createElement("span");
        body.className = "balloon-body";
        const colors = BALLOON_COLORS[i % BALLOON_COLORS.length];
        body.style.background = "radial-gradient(circle at 32% 28%, " + colors[0] + " 0 14%, " + colors[1] + " 15% 46%, " + colors[2] + " 72%)";
        body.style.transform = "rotate(" + (Math.random() * 8 - 4).toFixed(1) + "deg)";
        const text = document.createElement("span");
        text.className = "balloon-text zy";
        text.textContent = opt.label;
        text.style.fontSize = opt.label.length > 1 ? "2.15rem" : "3.3rem";
        body.append(text);
        const string = document.createElement("span");
        string.className = "string";
        const boom = document.createElement("span");
        boom.className = "boom-star emoji";
        boom.textContent = "⭐";
        btn.append(body, string, boom);
        btn.addEventListener("click", () => onPick(opt, btn));
        box.append(btn);
      });
    }

    async function askCurrent() {
      const question = quiz.questions[quiz.index];
      if (!question) return;
      quiz.prompt = question.prompt;
      syncQuizFallback();
      const session = beginSpeech();
      const ui = ++hearUi;
      const ear = $("btn-hear");
      ear.classList.add("is-speaking");
      try {
        await say(session, "請找出", { rate: 0.92, pitch: 1.24, lead: 90 });
        if (!session.alive()) return;
        await wait(120);
        if (!session.alive()) return;
        await say(session, question.prompt, { rate: 0.64, pitch: 1.3, lead: 0 });
      } finally {
        if (ui === hearUi) ear.classList.remove("is-speaking");
      }
    }

    function startQuiz() {
      const missing = EASY_KEYS.filter((key) => !BLENDS[key]);
      if (missing.length) console.warn("題庫缺少拼音", missing);
      quiz.questions = buildRound();
      quiz.index = 0;
      quiz.locked = false;
      quiz.hinted = false;
      $("win").classList.add("hidden");
      renderStars();
      showQuestion();
    }

    function showQuestion() {
      quiz.locked = false;
      quiz.hinted = false;
      renderBalloons(quiz.questions[quiz.index]);
      askCurrent();
    }

    function onPick(opt, btn) {
      if (quiz.locked || btn.classList.contains("popped") || btn.classList.contains("wobble")) return;
      AudioFX.pop();
      if (opt.ok) onCorrect(btn);
      else onWrong(btn);
    }

    function onWrong(btn) {
      AudioFX.soft();
      btn.classList.add("wobble");
      const clearWobble = () => btn.classList.remove("wobble");
      btn.addEventListener("animationend", clearWobble, { once: true });
      setTimeout(clearWobble, 450);
      if (quiz.hinted) return;
      quiz.hinted = true;
      const session = beginSpeech();
      $("btn-hear").classList.remove("is-speaking");
      say(session, "再試一次喔", { rate: 0.95, pitch: 1.28, lead: 70 });
    }

    async function onCorrect(btn) {
      quiz.locked = true;
      hearUi += 1;
      $("btn-hear").classList.remove("is-speaking");
      btn.classList.add("popped");
      btn.disabled = true;
      AudioFX.ding();
      AudioFX.fanfare();
      const rect = btn.getBoundingClientRect();
      burst(rect.left + rect.width / 2, rect.top + rect.height / 3, 78);
      rain(18);
      if (navigator.vibrate) navigator.vibrate(30);
      const star = $("stars").children[quiz.index];
      if (star) star.classList.add("got");
      quiz.index += 1;
      const session = beginSpeech();
      await say(session, pick(PRAISE), { rate: 0.98, pitch: 1.4, lead: 80 });
      if (!session.alive() || state.view !== "quiz") return;
      if (quiz.index >= quiz.questions.length) {
        await wait(250);
        if (state.view !== "quiz") return;
        showWin();
        return;
      }
      await wait(280);
      if (state.view !== "quiz") return;
      showQuestion();
    }

    function showWin() {
      quiz.locked = true;
      $("win").classList.remove("hidden");
      burst(window.innerWidth / 2, window.innerHeight * 0.35, 110);
      rain(36);
      const session = beginSpeech();
      say(session, "你全部找到了，你好棒", { rate: 0.95, pitch: 1.36, lead: 80 });
    }

    // ============================================================
    // 啟動
    // ============================================================

    function init() {
      resizeFx();
      window.addEventListener("resize", resizeFx);
      document.addEventListener("pointerdown", () => AudioFX.unlock());
      initRoster();
      initMagic();
      document.querySelectorAll("[data-go]").forEach((btn) => {
        btn.addEventListener("click", () => {
          AudioFX.pop();
          showView(btn.dataset.go);
        });
      });
      $("btn-home").addEventListener("click", () => {
        AudioFX.pop();
        showView("home");
      });
      document.querySelectorAll(".js-mute").forEach((btn) => btn.addEventListener("click", toggleMute));
      $("btn-hear").addEventListener("click", () => {
        if (quiz.locked) return;
        AudioFX.pop();
        askCurrent();
      });
      $("btn-again").addEventListener("click", () => {
        AudioFX.pop();
        $("win").classList.add("hidden");
        startQuiz();
      });
      $("btn-win-home").addEventListener("click", () => {
        AudioFX.pop();
        showView("home");
      });
      refreshVoices();
      if (window.speechSynthesis) {
        speechSynthesis.onvoiceschanged = refreshVoices;
        speechSynthesis.getVoices();
      }
    }

    init();
  </script>
</body>
</html>
