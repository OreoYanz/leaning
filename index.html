<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ㄅㄆㄇ注音樂園</title>
  <link rel="stylesheet" href="css/app.css?v=80">
</head>
<body data-scene="home">
  <div class="sky" aria-hidden="true">
    <span class="cloud one">☁️</span>
    <span class="cloud two">☁️</span>
    <span class="float star">⭐</span>
    <span class="float balloon">🎈</span>
  </div>
  <a class="skip" href="#screen">跳到遊戲</a>
  <header class="top">
    <button type="button" class="bubble" data-act="home" aria-label="回到首頁">🏠</button>
    <h1><span id="mascot"></span> ㄅㄆㄇ注音樂園</h1>
    <button type="button" class="bubble" id="mute" data-act="mute" aria-pressed="false" aria-label="關閉聲音">🔊</button>
  </header>
  <p id="live" class="live" aria-live="polite"></p>
  <main id="screen" tabindex="-1"></main>
  <footer class="credit">
    <p>© 2026 Yanz Wang</p>
    <p class="source">注音讀音：2017 © 教育部《國語注音符號手冊》開放部件，依 CC BY 4.0 使用，音檔未修改。</p>
  </footer>
  <canvas id="confetti" aria-hidden="true"></canvas>
  <div id="ghost" hidden></div>
  <script type="module" src="js/main.js?v=80"></script>
</body>
</html>
